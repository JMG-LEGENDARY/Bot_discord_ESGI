<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESGI BOT — Megastructure 3D</title>
</head>
<body>
  <canvas id="bg"></canvas>

  <div class="hud" id="hud">
    <div class="hud-top">
      <span class="hud-tag">SYS // ONLINE</span>
      <span class="hud-alt" id="hud-alt">ALT 690M</span>
    </div>
    <div class="hud-zone" id="hud-zone">CITADELLE ORBITALE</div>
    <div class="hud-track">
      <div class="hud-fill" id="hud-fill"></div>
    </div>
  </div>

  <div class="pillar-tooltip" id="pillar-tooltip">Cliquer pour inspecter le pilier</div>

  <div class="pillar-nav" id="pillar-nav">
    <button class="pillar-btn" data-label="underground-overview">Vue Triangle</button>
    <button class="pillar-btn" data-label="pillar-0">01. Bryan</button>
    <button class="pillar-btn" data-label="pillar-1">02. Collab 2</button>
    <button class="pillar-btn" data-label="pillar-2">03. Collab 3</button>
    <button class="pillar-btn" data-label="pillar-3">04. Promo ESGI</button>
    <button class="pillar-btn" data-label="pillar-4">05. Gemini AI</button>
  </div>

  <div class="scroll-hint" id="scroll-hint">Scroll pour descendre dans la tour ↓</div>
  <div class="scroll-container"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
