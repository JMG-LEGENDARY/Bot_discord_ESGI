<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aperçu téléphone — ESGI-Bot</title>
    <!-- Page de test uniquement (pas incluse dans le site final) :
         affiche le site dans un cadre de la taille d'un téléphone. -->
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #11131c;
        font-family: system-ui, sans-serif;
        color: #a9b3d6;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      .phone {
        width: 375px;
        height: 812px;
        max-height: calc(100vh - 40px);
        border: 10px solid #000;
        border-radius: 40px;
        overflow: hidden;
        box-shadow: 0 0 0 2px #2a2f45, 0 20px 60px rgba(0, 0, 0, 0.6);
        background: #000;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }
      p {
        margin: 0;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <iframe src="./" title="Site ESGI-Bot au format téléphone"></iframe>
    </div>
    <p>Aperçu 375 × 812 — faites défiler dans le téléphone</p>
  </body>
</html>
